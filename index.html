<title>Codév Minuteur</title>

<style>
/* Layout : pile iOS en une colonne sur un fond teinté et lumineux ; surfaces en verre dépoli (listes, contrôles, boutons de navigation, barre d'action flottante) ; relief par reflets, ombres douces et anneau lumineux. */
:root{
  --bg:#E8F0ED; --glow1:rgba(76,194,166,.38); --glow2:rgba(120,165,225,.30); --glow3:rgba(14,122,102,.20);
  --glass:rgba(255,255,255,.56); --glass-strong:rgba(255,255,255,.78); --glass-edge:rgba(255,255,255,.9);
  --shadow:0 1px 2px rgba(16,42,37,.05),0 10px 28px rgba(16,42,37,.09);
  --press:rgba(14,122,102,.08); --fill:rgba(20,50,44,.08); --sep:rgba(20,50,44,.12);
  --label:#0F1F1B; --label2:rgba(15,31,27,.58); --label3:rgba(15,31,27,.3);
  --accent:#0E7A66; --accent-hi:#1FB08F; --accent-soft:rgba(14,122,102,.11); --accent-shadow:rgba(14,122,102,.34); --on-accent:#FFFFFF;
  --red:#E0443A; --orange:#D97F00; --green:#1E9A53;
  --thumb:rgba(255,255,255,.96); --switch-off:rgba(20,50,44,.14); --knob:#FFFFFF; --dim:rgba(10,25,22,.26);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050C0B; --glow1:rgba(76,194,166,.24); --glow2:rgba(70,120,200,.20); --glow3:rgba(30,160,130,.14);
  --glass:rgba(34,42,40,.52); --glass-strong:rgba(44,52,50,.72); --glass-edge:rgba(255,255,255,.13);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.5);
  --press:rgba(76,194,166,.12); --fill:rgba(255,255,255,.08); --sep:rgba(255,255,255,.1);
  --label:#EAF2EF; --label2:rgba(234,242,239,.6); --label3:rgba(234,242,239,.3);
  --accent:#4CC2A6; --accent-hi:#86E2CA; --accent-soft:rgba(76,194,166,.15); --accent-shadow:rgba(76,194,166,.28); --on-accent:#04201A;
  --red:#FF6B5E; --orange:#FFAE3D; --green:#4ADE80;
  --thumb:rgba(255,255,255,.22); --switch-off:rgba(255,255,255,.16); --knob:#FFFFFF; --dim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050C0B; --glow1:rgba(76,194,166,.24); --glow2:rgba(70,120,200,.20); --glow3:rgba(30,160,130,.14);
  --glass:rgba(34,42,40,.52); --glass-strong:rgba(44,52,50,.72); --glass-edge:rgba(255,255,255,.13);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.5);
  --press:rgba(76,194,166,.12); --fill:rgba(255,255,255,.08); --sep:rgba(255,255,255,.1);
  --label:#EAF2EF; --label2:rgba(234,242,239,.6); --label3:rgba(234,242,239,.3);
  --accent:#4CC2A6; --accent-hi:#86E2CA; --accent-soft:rgba(76,194,166,.15); --accent-shadow:rgba(76,194,166,.28); --on-accent:#04201A;
  --red:#FF6B5E; --orange:#FFAE3D; --green:#4ADE80;
  --thumb:rgba(255,255,255,.22); --switch-off:rgba(255,255,255,.16); --knob:#FFFFFF; --dim:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:22px;letter-spacing:-.41px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(42% 32% at 12% 8%,var(--glow1),transparent 70%),radial-gradient(40% 30% at 92% 30%,var(--glow2),transparent 70%),radial-gradient(50% 36% at 30% 92%,var(--glow3),transparent 70%)}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto}

/* Verre dépoli */
.group,.seg,.cc,.navbtn,.bar .in,.ledger,.sheet-g,.sheet-b.cancel{
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-edge)}

/* Barre de navigation */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-inline:16px;transition:background .2s}
.nav::before{content:"";position:absolute;inset:0 0 -16px;z-index:-1;opacity:0;transition:opacity .2s;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.nav.scrolled::before{opacity:1}
.nav-l{justify-self:start;display:flex}
.nav-r{justify-self:end;display:flex}
.nav-t{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw;opacity:0;transition:opacity .2s}
.nav.show-t .nav-t{opacity:1}
.navbtn{display:flex;align-items:center;gap:6px;color:var(--accent);height:40px;min-width:40px;justify-content:center;padding-inline:14px;border-radius:20px;font-size:16px;font-weight:500}
.navbtn[aria-label]{padding:0;width:40px}
.navbtn:active{transform:scale(.94)}
.navbtn svg{flex:none}
.navbtn svg[viewBox="0 0 12 21"]{width:9px;height:16px}
.navbtn svg[viewBox="0 0 24 24"]{width:22px;height:22px}

/* Contenu */
.content{padding-inline:16px;padding-block:0 48px}
.content.with-bar{padding-bottom:136px}
.large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:8px 0 0}
.lede{margin:4px 0 0;font-size:15px;line-height:20px;letter-spacing:-.24px;color:var(--label2)}
.sec{margin-top:32px}
.sec-h{margin:0 0 8px;padding-inline:16px;font-size:13px;font-weight:600;line-height:18px;letter-spacing:.02em;text-transform:uppercase;color:var(--label2)}
.sec-f{margin:8px 0 0;padding-inline:16px;font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--label2)}
.sec-f.bad{color:var(--red)}

/* Listes groupées */
.group{border-radius:20px;overflow:hidden}
.group.tint{background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--glass)}
.group.hero{background:var(--glass-strong)}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:12px 16px;text-align:left;transition:background .15s}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:16px;height:.5px;background:var(--sep)}
button.row:active{background:var(--press)}
.row-main{flex:1;min-width:0}
.row-s{font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--label2);margin-top:2px}
.row.txt{font-size:16px;line-height:21px;letter-spacing:-.32px;align-items:flex-start}
.row.off{color:var(--label3)} .row.off .row-s{color:var(--label3)}
.row.center{justify-content:center;text-align:center}
.row.total .row-main,.row.total .val{font-weight:600;color:var(--label)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.num{flex:none;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);font-variant-numeric:tabular-nums}
.chev{flex:none;width:8px;height:14px;color:var(--label3)}
.check{flex:none;width:18px;height:18px;color:var(--accent)}
.accent{color:var(--accent);font-weight:500} .red{color:var(--red);font-weight:500}

/* Interrupteur */
.switch{flex:none;position:relative;width:51px;height:31px;border-radius:16px;background:var(--switch-off);transition:background .25s;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 3px 8px rgba(0,0,0,.18),0 1px 1px rgba(0,0,0,.08);transition:transform .25s}
[aria-checked="true"] .switch{background:linear-gradient(180deg,var(--accent-hi),var(--accent))}
[aria-checked="true"] .switch::after{transform:translateX(20px)}

/* Contrôle segmenté */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:18px}
.seg button{height:36px;border-radius:14px;font-size:14px;font-weight:500;letter-spacing:-.15px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--label2);transition:background .2s,color .2s}
.seg button[aria-checked="true"]{background:var(--thumb);color:var(--accent);font-weight:600;box-shadow:0 4px 12px rgba(16,42,37,.12),0 1px 2px rgba(16,42,37,.08),inset 0 1px 0 var(--glass-edge)}

/* Barre d'action flottante */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar .in{max-width:568px;margin:0 auto;padding:6px;border-radius:30px;pointer-events:auto}
.cta{display:block;width:100%;height:52px;border-radius:24px;background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:var(--on-accent);font-size:17px;font-weight:600;text-align:center;
  box-shadow:0 6px 18px var(--accent-shadow),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.08);transition:transform .15s}
.cta:active{transform:scale(.98)}

/* Séance */
.steps{display:flex;gap:4px;margin-top:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--fill)}
.steps i.done{background:var(--accent);opacity:.45}
.steps i.now{background:linear-gradient(90deg,var(--accent-hi),var(--accent));box-shadow:0 0 8px var(--accent-shadow)}
.t1{margin:24px 0 0;font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;text-wrap:balance}
.timer{position:relative;width:min(70vw,272px);aspect-ratio:1;max-width:100%;margin:24px auto 0}
.timer svg{position:relative;z-index:1;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.timer .tr{fill:none;stroke:var(--fill);stroke-width:8}
.timer .pr{fill:none;stroke:url(#rg);stroke-width:8;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--accent-shadow));transition:stroke-dashoffset .25s linear}
.timer .s1{stop-color:var(--accent-hi)} .timer .s2{stop-color:var(--accent)}
.face{position:absolute;inset:16px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-edge)}
.t-state{font-size:14px;line-height:18px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--label2)}
.t-num{font-family:var(--round);font-size:clamp(52px,16vw,72px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.t-sub{font-size:13px;line-height:18px;color:var(--label2);font-variant-numeric:tabular-nums}
.timer.warn .pr{stroke:var(--orange);filter:drop-shadow(0 0 6px var(--orange))} .timer.warn .t-num,.timer.warn .t-state{color:var(--orange)}
.timer.over .pr{stroke:var(--red);filter:drop-shadow(0 0 6px var(--red))} .timer.over .t-num,.timer.over .t-state{color:var(--red)}
.timer.paused .t-num{color:var(--label2)}
.ledger{display:flex;justify-content:center;margin:24px auto 0;padding:10px 0;border-radius:20px;max-width:400px}
.lg{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.lg+.lg::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:.5px;background:var(--sep)}
.lg span{font-size:12px;line-height:16px;color:var(--label2)}
.lg b{font-family:var(--round);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.lg.up b{color:var(--green)} .lg.down b{color:var(--red)}
.ctrls{display:flex;justify-content:center;gap:32px;margin-top:24px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:8px}
.cc{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);transition:transform .15s}
.cc svg{width:24px;height:24px}
.cc b{font-family:var(--round);font-size:18px;font-weight:700}
.cbtn:active .cc{transform:scale(.92)}
.cl{font-size:12px;line-height:16px;color:var(--label2);font-weight:500}
.tot{display:grid;grid-template-columns:1fr auto;align-items:end;gap:16px;padding:16px}
.lbl{display:block;font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--label2)}
.big{display:block;font-family:var(--round);font-size:36px;line-height:42px;font-weight:700;font-variant-numeric:tabular-nums}
.mid{display:block;font-family:var(--round);font-size:22px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.tot-b{text-align:right}
.prog{grid-column:1/-1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-hi),var(--accent));border-radius:3px;transition:width .25s linear}
.tot.late .big{color:var(--red)} .tot.late .prog i{background:var(--red)}

/* Réglages */
.row.field{display:block}
.field input,.field textarea{display:block;width:100%;border:0;background:transparent;color:var(--label);font:inherit;font-size:17px;line-height:22px;letter-spacing:-.41px;padding:0;margin:0;resize:none;outline:none}
.field textarea{min-height:132px}
.stepper{flex:none;display:flex;align-items:center;height:34px;border-radius:17px;background:var(--fill)}
.stepper button{width:46px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.stepper button:active{opacity:.4}
.stepper svg{width:14px;height:14px}
.stepper i{width:.5px;height:18px;background:var(--sep)}
.sv{flex:none;min-width:56px;text-align:right;color:var(--label2);font-variant-numeric:tabular-nums}
.delta{font-family:var(--round);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.plus{color:var(--red)} .delta.minus{color:var(--green)}

/* Feuille d'actions */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:var(--dim);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet-wrap.open .sheet-bg{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-g{border-radius:24px;overflow:hidden;background:var(--glass-strong)}
.sheet-h{padding:16px;text-align:center;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--label2)}
.sheet-h b{font-weight:600}
.sheet-b{display:block;width:100%;height:56px;font-size:18px;font-weight:500;text-align:center;color:var(--accent);border-radius:24px}
.sheet-b.cancel{background:var(--glass-strong);font-weight:600}
.sheet-g .sheet-b{border-radius:0;box-shadow:inset 0 .5px 0 var(--sep)}
.sheet-b.red{color:var(--red)}
.sheet-b:active{background:var(--press)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<script>
(function(){
"use strict";
var DUR=[45,60,75,90,120];
var PCT=[10,20,5,35,15,15];
/* Répartitions du référentiel DITP (support de formation des animateurs de codéveloppement, octobre 2026). */
var DITP={45:[5,14,4,14,3,5],60:[10,12,5,20,6,7],75:[10,20,5,20,10,10],90:[14,20,8,25,8,15],120:[14,30,10,35,10,21]};
/* Inclusion et cueillette comprises : étapes retranchées selon le référentiel (chaque durée reprend les étapes de la durée inférieure).
   1 h 15 : le support affiche 45 min d'étapes, incohérent avec 75 - 15 ; on retient la cascade (étapes de la séance d'1 h).
   45 min : réservée à un groupe pérenne ; l'inclusion a déjà eu lieu ou est comptée à part, jamais retranchée. */
var DITP_C={60:[3,15,4,15,3,5],75:[10,12,5,20,6,7],90:[10,20,5,20,10,10],120:[14,20,8,25,8,15]};
var P0DEF={45:15,60:15,75:15,90:15,120:30};
var CFG_V=2;
var K="codev.v1.", $app=document.getElementById("app");
var C=339.29;

var DEFAULT_PHASES=[
 {t:"Inclusion et cueillette",
  e:"Accueillir les participants, préciser horaires, pauses et logistique\nRappeler les principes du codéveloppement, les six étapes et les trois rôles\nCoconstruire et valider le cadre d’alliance : règles et fonctionnement du groupe\nCueillette : chacun présente très succinctement son sujet, le groupe choisit celui qui sera traité",
  k:"Attention à la gestion du temps dès cette étape\nUn bon sujet : situation réelle, présente, professionnelle, sur laquelle le demandeur peut agir (les 6 P)\nChoisir selon la résonance, l’urgence et l’enjeu, par vote ou discussion, puis recueillir l’accord du client\nLe cas échéant, retour du client de la séance précédente sur ses actions"},
 {t:"Exposé de la situation / du problème",
  e:"Le demandeur expose le sujet pour lequel il sollicite l’aide des consultants, en donnant un maximum de données\nObjectif : identifier la problématique du demandeur\nContexte, préoccupation ou projet, actions déjà engagées, puis un titre qui résume sa question",
  k:"Reformuler si nécessaire\nInciter le demandeur à exposer simplement sa situation, qui sera dépliée lors de la clarification\nLes consultants écoutent sans interrompre"},
 {t:"Clarification / Questions",
  e:"Les consultants posent les questions relatives à la compréhension du problème posé\nRendre plus explicite l’implicite\nComprendre avant de décider",
  k:"Donner au client le choix de la formule : questions au fil de l’eau ou en bloc\nIntervenir quand les questions sont inductives ou suggèrent une solution\nGérer l’équilibre de la parole ; le client peut réserver sa réponse"},
 {t:"Contrat de consultation",
  e:"Le client indique ses attentes aux membres du groupe et la forme de la consultation souhaitée\nSe centrer de la même manière sur l’objet de la demande\nFormuler la demande en deux lignes au plus : « Aidez-moi à… »",
  k:"Demander si la question a évolué et laisser 2 à 3 minutes de réflexion au client\nAider à élaborer le contrat sans le faire à sa place\nVérifier que les consultants le trouvent clair et acceptent de le traiter"},
 {t:"Consultation",
  e:"Les consultants expriment leurs avis, partagent leurs impressions, donnent des idées et des retours d’expérience, formulent des suggestions\nSavoir distinguer ce qu’une suggestion peut apporter, oser dire, oser critiquer avec respect",
  k:"Inviter le client à une écoute silencieuse et à la prise de notes\nRéguler les temps de parole et favoriser la divergence des apports\nÉviter le débat entre consultants : c’est au client de choisir\nPause possible avant cette étape"},
 {t:"Synthèse et plan d’actions",
  e:"Le client fait la synthèse de ce qu’il a reçu du groupe et pose ses premiers petits pas vers la résolution\nRecueillir des informations éparses dans une perspective pragmatique, concrète et réaliste\nÉlaborer un plan d’action",
  k:"Laisser 2 à 3 minutes au client pour préparer sa synthèse\nLe client n’a pas à justifier ce qu’il retient ou non\nL’aider à se concentrer sur son plan et sur ce qu’il veut partager au groupe"},
 {t:"Bilan des apprentissages et évaluations",
  e:"Les participants échangent leurs impressions, apprentissages et appréciations\nChacun fait le bilan de ce que la séance lui a apporté\nÉvaluer et intégrer les apprentissages, distinguer l’essentiel de l’accessoire",
  k:"Appréciation, apprentissages, application : ce que j’ai aimé, ce que j’ai appris, ce que je souhaite appliquer\nL’animateur participe au bilan, en dernier\nFermer la boucle en donnant son propre retour"}
];

/* ---------- Données ---------- */
function distribute(weights,total,min){
  min=min||1; var sw=weights.reduce(function(a,b){return a+b},0)||1;
  var raw=weights.map(function(w){return w/sw*total});
  var out=raw.map(function(r){return Math.max(min,Math.floor(r))});
  var diff=total-out.reduce(function(a,b){return a+b},0);
  var order=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  var g=0;
  while(diff>0){out[order[g%order.length][1]]++;diff--;g++}
  while(diff<0){var big=out.indexOf(Math.max.apply(null,out));out[big]--;diff++}
  return out;
}
function defaultDist(c){var d={};DUR.forEach(function(m){d[m]=((c&&DITP_C[m])||DITP[m]).slice()});return d}
function load(key,fb){try{var v=localStorage.getItem(K+key);return v?JSON.parse(v):fb}catch(e){return fb}}
function save(key,v){try{localStorage.setItem(K+key,JSON.stringify(v))}catch(e){}}
function drop(key){try{localStorage.removeItem(K+key)}catch(e){}}

function fmtDur(m){var h=Math.floor(m/60),r=m%60;if(!h)return m+" min";return h+" h"+(r?" "+String(r).padStart(2,"0"):"")}
function mmss(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+":"+String(s).padStart(2,"0")}
function clockTime(d){return d.getHours()+" h "+String(d.getMinutes()).padStart(2,"0")}

var bell=null,SRC={},SILENCE="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQQAAAAAAAAA";
var TONES=[
 {id:"zen",n:"Cloche zen",d:"Deux frappes douces et longues"},
 {id:"carillon",n:"Carillon",d:"Trois notes claires et ascendantes"},
 {id:"clochette",n:"Clochette d’accueil",d:"Tintements vifs et aigus, bien perçus"},
 {id:"signal",n:"Signal",d:"Bips répétés, audibles même dans une salle bruyante"}
];
function strikes(t,times,parts,amp){var v=0;for(var s=0;s<times.length;s++){var tt=t-times[s];if(tt<0)continue;var att=Math.min(1,tt/0.004);
  for(var j=0;j<parts.length;j++){var q=parts[j];v+=(amp?amp[s]:1)*att*q[1]*Math.exp(-tt/q[2])*Math.sin(2*Math.PI*q[0]*tt)}}return v}
var SPEC={
 zen:{dur:4.2,f:function(t){return strikes(t,[0,1.15],[[392,1,1.6],[784,.55,1.1],[1082,.35,.8],[1568,.22,.55],[2117,.12,.35]],[1,.85])}},
 carillon:{dur:3.4,f:function(t){var v=0,seq=[[0,659],[.28,784],[.56,1047],[1.4,659],[1.68,784],[1.96,1047]];
   for(var i=0;i<seq.length;i++){var f=seq[i][1];v+=strikes(t,[seq[i][0]],[[f,1,.9],[2*f,.45,.5],[3*f,.2,.25]])}return v}},
 clochette:{dur:2.6,f:function(t){var f=2093;return strikes(t,[0,.2,.4,1.1,1.3,1.5],[[f,1,.6],[f*1.51,.55,.35],[f*2.66,.3,.18]])}},
 signal:{dur:2.8,f:function(t){var g=t%0.95;if(g>0.8)return 0;var b=g%0.2;if(b>0.12)return 0;
   var env=Math.min(1,b/0.005,(0.12-b)/0.005),f=Math.floor(g/0.2)%2?1500:1000,w=2*Math.PI*f*t;return env*(Math.sin(w)+Math.sin(3*w)/3+Math.sin(5*w)/5)}}
};
/* Synthèse d'une sonnerie en WAV, normalisée au même niveau sonore. */
function synth(id){
  var sr=22050,sp=SPEC[id],n=Math.floor(sr*sp.dur),raw=new Float32Array(n),peak=0,i;
  for(i=0;i<n;i++){raw[i]=sp.f(i/sr);var m=Math.abs(raw[i]);if(m>peak)peak=m}
  var k=0.92/(peak||1),buf=new ArrayBuffer(44+n*2),dv=new DataView(buf);
  function str(o,x){for(var j=0;j<x.length;j++)dv.setUint8(o+j,x.charCodeAt(j))}
  str(0,"RIFF");dv.setUint32(4,36+n*2,true);str(8,"WAVEfmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);str(36,"data");dv.setUint32(40,n*2,true);
  var pcm=new Int16Array(buf,44);for(i=0;i<n;i++)pcm[i]=raw[i]*k*32767;
  var bytes=new Uint8Array(buf),bin="",CH=0x8000;
  for(i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return "data:audio/wav;base64,"+btoa(bin);
}
function toneSrc(id){id=SPEC[id]?id:"zen";if(!SRC[id])SRC[id]=synth(id);return SRC[id]}
function toneName(id){for(var i=0;i<TONES.length;i++)if(TONES[i].id===id)return TONES[i].n;return TONES[0].n}
function getBell(){if(!bell){bell=new Audio();bell.preload="auto"}return bell}
/* Déverrouillage audio iOS par un court silence : la sonnerie n'est jamais jouée à ce moment. */
function unlockAudio(){
  try{var a=getBell();if(a.dataset.unlocked)return;a.src=SILENCE;var p=a.play();
    var done=function(){a.dataset.unlocked="1";try{a.pause()}catch(e){};a.src=toneSrc(cfg.tone);a.load()};
    if(p&&p.then)p.then(done).catch(function(){a.src=toneSrc(cfg.tone)});else done()}catch(e){}
}
function ring(id){try{var a=getBell(),src=toneSrc(id||cfg.tone);if(a.src!==src)a.src=src;a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}

/* ---------- Plan de séance ---------- */
function buildPlan(total,mode,p0){
  if(total===45&&mode==="inclus")mode="sus";
  var six,list=[];
  /* Inclusion comprise : répartition retranchée du référentiel ; si la durée d'inclusion diffère de celle prévue, ajustement proportionnel. */
  if(mode==="inclus"){var b=(cfg.distC[total]||DITP_C[total]).slice(),tgt=Math.max(6,total-p0),sb=b.reduce(function(x,y){return x+y},0);six=sb===tgt?b:distribute(b,tgt)}
  else six=(cfg.dist[total]||DITP[total]).slice();
  if(mode!=="none")list.push({n:0,min:p0});
  six.forEach(function(m,i){list.push({n:i+1,min:m})});
  return list;
}
function short(m){return m<60?m+" min":fmtDur(m)}

  var h=nav({large:true,title:"Répartition",back:{a:"settings",l:"Réglages"}});
  h+='<main class="content"><h1 class="large">Répartition</h1>';
  h+=sec("Durée de la séance",seg("dseg",DUR.map(function(m){return {v:m,l:short(m)}}),distDur));
  if(distDur===45)h+=sec("Inclusion et cueillette",'',"Pour 45 min, l’inclusion n’est jamais retranchée : elle a déjà eu lieu (groupe pérenne) ou est comptée à part.");
  else h+=sec("Inclusion et cueillette",seg("dmode",[{v:"sans",l:"Non incluses"},{v:"avec",l:"Comprises"}],distMode),
    avec?"Étapes retranchées lorsque l’inclusion ("+P0DEF[distDur]+" min) est prise sur la durée de la séance.":"Étapes lorsque l’inclusion n’est pas incluse ou s’ajoute à la séance.");
  h+=sec("Étapes",group(d.map(function(v,r){return row({lead:'<span class="num">'+(r+1)+'</span>',label:esc(cfg.phases[r+1].t),ell:true,
    trail:'<span class="sv">'+v+' min</span><div class="stepper"><button data-a="dm" data-v="'+r+'" aria-label="Retirer une minute">'+IC.minus+'</button><i></i><button data-a="dp" data-v="'+r+'" aria-label="Ajouter une minute">'+IC.plus+'</button></div>'})})),
    ok?"Total : "+s+" min, conforme"+(avec?" ("+short(distDur)+" moins "+P0DEF[distDur]+" min d’inclusion).":" à la durée de la séance."):"Total : "+s+" min pour "+tgt+" min attendues. Ajustez de "+(tgt-s>0?"+":"−")+Math.abs(tgt-s)+" min.",ok?"":"bad");
  h+=sec(null,'',"Valeurs par défaut issues du référentiel DITP de formation des animateurs de codéveloppement.");
  return h+'</main>';
}

var V={home:vHome,session:vSession,end:vEnd,settings:vSettings,phase:vPhase,dist:vDist};
function render(){$app.innerHTML=V[view]();onScroll();if(view==="session")tick()}
function go(v){view=v;render();window.scrollTo(0,0);onScroll()}

function onScroll(){
  var n=document.getElementById("nav");if(!n)return;var y=window.scrollY||0;
  n.classList.toggle("scrolled",y>2);
  if(n.classList.contains("has-large"))n.classList.toggle("show-t",y>40);
}
window.addEventListener("scroll",onScroll,{passive:true});

/* ---------- Séance ---------- */
function startSession(){
  unlockAudio();keepAwake();
  var plan=buildPlan(cfg.total,cfg.mode,cfg.p0);
  S={total:cfg.total,mode:cfg.mode,startedAt:Date.now(),i:0,running:true,tStart:Date.now(),acc:0,rang:false,
     phases:plan.map(function(p){return {n:p.n,initial:p.min*60,plan:p.min*60,used:null,adj:0,manual:0,sound:cfg.sound}})};
  save("session",S);go("session");
}
function elapsed(){return S.acc+(S.running?(Date.now()-S.tStart)/1000:0)}
function phSound(ph){return ph.sound==null?cfg.sound:ph.sound}
function setT(id,t){var e=document.getElementById(id);if(e&&e.textContent!==t)e.textContent=t}

function ledger(ph){
  var el=document.getElementById("ledger");if(!el)return;
  var adj=ph.adj||0,man=ph.manual||0;
  function sg(v){return v?(v>0?"+":"−")+mmss(Math.abs(v)):"0:00"}
  var cells=[["Prévu",mmss(ph.initial),""],["Report",sg(adj),adj>0?"up":adj<0?"down":""]];
  if(man)cells.push(["Ajouts",sg(man),""]);
  cells.push(["Retenu",mmss(ph.plan),""]);
  var h=cells.map(function(c){return '<div class="lg '+c[2]+'"><span>'+c[0]+'</span><b>'+c[1]+'</b></div>'}).join("");
  if(el.dataset.h!==h){el.dataset.h=h;el.innerHTML=h}
}

function tick(){
  if(view!=="session"||!S)return;
  var clk=document.getElementById("clk");if(!clk)return;
  var ph=S.phases[S.i],el=elapsed(),left=ph.plan-el;
  clk.className="timer"+(left<0?" over":left<=60?" warn":"")+(S.running?"":" paused");
  setT("tm",(left<0?"+":"")+mmss(Math.abs(left)));
  setT("st",!S.running?"En pause":left<0?"Dépassement":left<=60?"Dernière minute":"Restant");
  setT("pl","sur "+mmss(ph.plan));
  var frac=Math.min(1,Math.max(0,el/ph.plan));
  document.getElementById("pr").setAttribute("stroke-dashoffset",(C*(left<0?0:frac)).toFixed(2));
  setT("pz",S.running?"Pause":"Reprendre");
  var pzi=document.getElementById("pzi"),want=S.running?"p":"r";
  if(pzi.dataset.s!==want){pzi.dataset.s=want;pzi.innerHTML=S.running?IC.pause:IC.play}
  /* Temps global projeté : un dépassement en cours est imputé immédiatement, selon la règle du passage d'étape. */
  var ov=Math.max(0,-left),after=0;
  for(var j=S.i+1;j<S.phases.length;j++){var cut=Math.min(Math.max(0,S.phases[j].plan-60),ov);ov-=cut;after+=S.phases[j].plan-cut}
  var totalLeft=Math.max(0,left)+after-ov;
  document.getElementById("tot").classList.toggle("late",totalLeft<0);
  setT("rest",(totalLeft<0?"+ ":"")+restFmt(Math.abs(totalLeft)));
  var etaMs=Date.now()+totalLeft*1000;
  setT("eta",clockTime(new Date(etaMs)));
  var init=S.startedAt+S.phases.reduce(function(a,p){return a+p.initial},0)*1000,dm=Math.round((etaMs-init)/60000);
  setT("eta0","Fin initialement prévue à "+clockTime(new Date(init))+(dm?", écart de "+(dm>0?"+":"−")+Math.abs(dm)+" min.":", séance dans les temps."));
  var done=0;for(var q=0;q<S.i;q++)done+=S.phases[q].used||0;done+=el;
  document.getElementById("sbi").style.width=(totalLeft<=0?100:Math.min(100,done/(done+totalLeft)*100)).toFixed(1)+"%";
  ledger(ph);
  if(left<=0&&!S.rang){S.rang=true;save("session",S);if(phSound(ph))ring()}
}
setInterval(tick,250);

function nextPhase(){
  var ph=S.phases[S.i];ph.used=elapsed();
  var over=Math.round(ph.used-ph.plan);
  /* Dépassement : retranché de l'étape suivante, puis des suivantes si besoin (plancher d'une minute). */
  if(over>0){for(var j=S.i+1;j<S.phases.length&&over>0;j++){var room=Math.max(0,S.phases[j].plan-60),cut=Math.min(room,over);S.phases[j].plan-=cut;S.phases[j].adj=(S.phases[j].adj||0)-cut;over-=cut}}
  /* Temps gagné : ajouté en totalité à l'étape suivante ; non utilisé, il passe à son tour à la suivante. */
  else if(over<0&&S.i<S.phases.length-1){var nx=S.phases[S.i+1];nx.plan+=-over;nx.adj=(nx.adj||0)-over}
  if(S.i>=S.phases.length-1){S.ended=true;S.running=false;S.endedAt=Date.now();save("session",S);try{lock&&lock.release()}catch(e){}go("end");return}
  S.i++;S.acc=0;S.tStart=Date.now();S.running=true;S.rang=false;save("session",S);go("session");
}

/* ---------- Interactions ---------- */
$app.addEventListener("input",function(ev){
  var t=ev.target;if(t.dataset.f){cfg.phases[editIdx][t.dataset.f]=t.value;save("cfg",cfg)}
});
$app.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case "total":cfg.total=+v;cfg.p0=P0DEF[cfg.total];if(cfg.total===45&&cfg.mode==="inclus")cfg.mode="sus";save("cfg",cfg);render();break;
    case "mode":cfg.mode=v;save("cfg",cfg);render();break;
    case "p0":cfg.p0=+v;save("cfg",cfg);render();break;
    case "sound":cfg.sound=!cfg.sound;save("cfg",cfg);if(cfg.sound)unlockAudio();render();break;
    case "testbell":case "bell":unlockAudio();ring();break;
    case "tone":cfg.tone=v;save("cfg",cfg);unlockAudio();ring(v);render();break;
    case "settings":go("settings");break;
    case "home":go("home");break;
    case "start":
      if(S&&!S.ended)sheet({title:"Remplacer la séance en cours ?",msg:"La séance en cours sera abandonnée.",ok:"Lancer une nouvelle séance",fn:startSession});
      else startSession();break;
    case "resume":unlockAudio();keepAwake();go("session");break;
    case "pause":if(S.running){S.acc=elapsed();S.running=false}else{S.tStart=Date.now();S.running=true}save("session",S);tick();break;
    case "plus":var ph=S.phases[S.i];ph.plan+=60;ph.manual=(ph.manual||0)+60;if(ph.plan-elapsed()>0)S.rang=false;save("session",S);tick();break;
    case "psound":var cp=S.phases[S.i];cp.sound=!phSound(cp);save("session",S);if(cp.sound)unlockAudio();
      b.setAttribute("aria-checked",String(cp.sound));break;
    case "next":nextPhase();break;
    case "stop":sheet({title:"Arrêter la séance ?",msg:"Le minuteur est remis à zéro et la séance est abandonnée.",ok:"Arrêter la séance",
      fn:function(){S=null;drop("session");try{lock&&lock.release()}catch(e){}go("home")}});break;
    case "new":S=null;drop("session");go("home");break;
    case "phase":editIdx=+v;go("phase");break;
    case "dist":distDur=cfg.total;go("dist");break;
    case "dseg":distDur=+v;render();break;
    case "dmode":distMode=v;render();break;
    case "dm":case "dp":var r=+v,arr=(distMode==="avec"?cfg.distC:cfg.dist)[distDur];arr[r]=Math.max(1,Math.min(120,arr[r]+(a==="dp"?1:-1)));save("cfg",cfg);render();break;
    case "reset":sheet({title:"Rétablir les valeurs par défaut ?",msg:"Vos titres, enjeux, repères et répartitions seront remplacés.",ok:"Rétablir",
      fn:function(){cfg.phases=JSON.parse(JSON.stringify(DEFAULT_PHASES));cfg.dist=defaultDist();cfg.distC=defaultDist(true);save("cfg",cfg);render()}});break;
  }
});

render();
})();
</script>
